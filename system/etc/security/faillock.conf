# pam_faillock — every PAM entry (greeter, hyprlock, sudo, sshd) shares
# this counter. The stock 3 failures / 10 minutes locks the account on
# a mistyped passphrase and one retry; 5 within 15 minutes and 2
# minutes out still stops a brute force (the firewall keeps sshd off
# the network anyway) without punishing a fumble at the lock screen.
deny = 5
fail_interval = 900
unlock_time = 120
