# sshd answers the tailnet only: the firewall (/etc/nftables.conf)
# admits port 22 from tailscale0 alone, so a client is already a
# tailnet peer before sshd sees it. Then a key, and only a key:
# PasswordAuthentication off closes the password path,
# AuthenticationMethods publickey makes a key the one accepted method
# whatever a later drop-in or the package's file turns on, and
# AllowGroups wheel limits logins to the administrator accounts
# (sshd_config(5); Arch Wiki, OpenSSH: "Force public key
# authentication", "Limit root login", "Configuration").
# KbdInteractiveAuthentication is already off in the package's
# 99-archlinux.conf.
PasswordAuthentication no
PermitRootLogin no
AuthenticationMethods publickey
AllowGroups wheel
