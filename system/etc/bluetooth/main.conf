# bluez: the adapter stays powered off until asked (bluetui,
# Mod+Ctrl+B), so an unused radio costs nothing and advertises
# nothing; the bar's bluetooth module is absent while it is off.
# While it is on, Privacy = device makes the controller advertise and
# scan under a resolvable private address that rotates, instead of
# its fixed identity address (the package's main.conf documents the
# modes; "device" keeps peers that never received the laptop's IRK
# reachable). A Low Energy peripheral paired before this setting was
# in place has to be paired again; classic audio is unaffected.
# Replaces the package's all-comments main.conf; every other setting
# is bluez's default.
[General]
Privacy = device

[Policy]
AutoEnable=false
