# DNS goes through systemd-resolved (see systemd/resolved.conf.d):
# NetworkManager hands each link's DHCP resolver to resolved, where the
# global route-only domain "~." keeps every query on the configured
# DNS-over-TLS server; the link's resolver is only asked while
# netmenu's captive-portal action gives the link "~." for a login page.
[main]
dns=systemd-resolved

# defaults for every new connection profile: a stable random MAC per
# network (the same one each time on that network, a different one
# elsewhere), IPv6 privacy addresses preferred, no LLMNR/mDNS name
# leakage. Profiles that already exist keep their own values;
# setup.sh's apply_nm_privacy brings them in line once.
[connection]
wifi.cloned-mac-address=stable
ethernet.cloned-mac-address=stable
ipv6.ip6-privacy=2
connection.llmnr=0
connection.mdns=0

[device]
wifi.scan-rand-mac-address=yes
