# DNS goes through systemd-resolved (see systemd/resolved.conf.d):
# NetworkManager hands each link's DHCP resolver to resolved, which
# asks it while no tunnel is up; the Mullvad tunnel brings its own
# resolver with the route-only domain "~." and takes every query
# while it is.
[main]
dns=systemd-resolved

# defaults for every new connection profile: a stable random MAC per
# network (the same one each time on that network, a different one
# elsewhere), IPv6 privacy addresses preferred, no LLMNR/mDNS name
# leakage, and nothing in the DHCP exchange that names the machine:
# no hostname option, and a DHCPv6 DUID derived from the profile
# instead of the link-layer address (nm-settings(5); Arch Wiki,
# NetworkManager: "Turn off hostname sending" and "Configure a unique
# DUID per connection"; both are honoured by the internal DHCP client
# in use here). Profiles that already exist keep their own values
# where they set one; setup.sh's apply_nm_privacy brings the MAC,
# IPv6 and LLMNR/mDNS settings in line once, and the DHCP keys are
# unset (default) in every existing profile here, so the defaults
# below apply to them.
[connection]
wifi.cloned-mac-address=stable
ethernet.cloned-mac-address=stable
ipv6.ip6-privacy=2
connection.llmnr=0
connection.mdns=0
ipv4.dhcp-send-hostname=0
ipv6.dhcp-send-hostname=0
ipv6.dhcp-duid=stable-uuid

[device]
wifi.scan-rand-mac-address=yes
