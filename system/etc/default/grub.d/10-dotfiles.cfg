# Sourced by grub-mkconfig after /etc/default/grub (drop-ins are plain
# shell, so this appends to the install's own cmdline rather than
# replacing it — the cryptdevice/root line stays the machine's).
#
# The menu stays hidden unless Esc or Shift is held in the two-second
# window: the LTS kernel and the btrfs snapshot entries remain one key
# away, never on the screen. `splash` starts plymouth from the
# initramfs; udev keeps its lines off the console beneath it.
# GRUB_GFXPAYLOAD_LINUX=keep (Arch's default) hands the mode GRUB set
# straight to the kernel, so there is no second modeset before KMS.
GRUB_TIMEOUT_STYLE=hidden
GRUB_TIMEOUT=2
GRUB_CMDLINE_LINUX_DEFAULT="$GRUB_CMDLINE_LINUX_DEFAULT splash udev.log_level=3"
