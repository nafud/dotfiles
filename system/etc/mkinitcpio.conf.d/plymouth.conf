# Sourced after /etc/mkinitcpio.conf. Slots the plymouth hook in right
# after the init hook (udev, or systemd on a systemd initramfs) — ahead
# of encrypt, whose passphrase prompt then goes through plymouth — and
# leaves the rest of the machine's HOOKS line (encrypt, fsck,
# grub-btrfs-overlayfs, ...) exactly as the install wrote it. A HOOKS
# line without either init hook is left alone: no plymouth, no splash,
# nothing broken. Early KMS (the kms hook, Arch's default) is what lets
# plymouth draw at native resolution.
if [[ " ${HOOKS[*]} " != *" plymouth "* ]]; then
    _hooks=()
    for _hook in "${HOOKS[@]}"; do
        _hooks+=("$_hook")
        [[ $_hook == udev || $_hook == systemd ]] && _hooks+=(plymouth)
    done
    HOOKS=("${_hooks[@]}")
    unset _hooks _hook
fi
