# Kernel modules this machine never uses, kept from loading. Two
# strengths, as the Arch Wiki's Kernel module page distinguishes them:
# "install <name> /bin/false" refuses the module by any means, also as
# a dependency; "blacklist <name>" only stops automatic loading, so an
# explicit root modprobe still works. The first is for protocols and
# drivers with no use here (no such hardware, no such peers), the
# second for filesystems a desktop may one day need for a disc or a
# share. The modconf hook copies this file into both initramfs images
# at the next mkinitcpio run, so the rules hold there as well.
# Deliberately not here: thunderbolt (real ports, DMA-protected by the
# IOMMU), bluetooth and btusb (in use), usb_storage and uas (external
# drives), which the usual published lists include; and ksmbd, the
# in-kernel SMB server, because it declares softdeps of its own
# (modinfo -F softdep ksmbd) and modprobe.d(5) gives a softdep
# precedence over an install command for the same module, so
# /bin/false would be ignored for it. It has no alias and no userspace
# here requests it; the kernel's module_blacklist= parameter is the
# refusal that works for it, and belongs with the command line.
install sctp /bin/false
install rds /bin/false
install tipc /bin/false
install n-hdlc /bin/false
install atm /bin/false
install can /bin/false
install firewire-core /bin/false
install floppy /bin/false
install vivid /bin/false
install gfs2 /bin/false
install cramfs /bin/false
install jffs2 /bin/false
install hfs /bin/false
install hfsplus /bin/false
blacklist squashfs
blacklist udf
blacklist cifs
blacklist nfs
blacklist nfsv3
blacklist nfsv4
