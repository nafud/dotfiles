# /boot is unencrypted (the kernel, the initramfs and grub.cfg with the
# LUKS device names live there). The filesystem package creates it
# 0755; this keeps it root-only, so no user process can read the
# initramfs or the boot config. z adjusts the mode of an existing
# path and creates nothing (tmpfiles.d(5)). Everything that reads
# /boot here runs as root: mkinitcpio, grub-mkconfig, grub-btrfsd,
# bootkeep and the pacman hooks. pacman only warns about the differing
# mode on a filesystem upgrade (Arch Wiki, Security: "File access
# permissions").
z /boot 0700 root root -
