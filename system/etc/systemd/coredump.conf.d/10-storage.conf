# A core dump is a process's memory, secrets included, kept on disk
# (Arch Wiki, Core dump: "Disabling automatic core dumps"). With
# Storage=none systemd-coredump still receives the core, writes it to
# an unlinked temporary file under /var/lib/systemd/coredump on the
# encrypted root to extract the backtrace, logs that, and keeps
# nothing (coredump.conf(5)). ProcessSizeMax=0 would skip the core
# entirely and with it the backtrace, which the greeter and lock work
# still relies on. Dumps already on disk expire through the shipped
# tmpfiles rule (2w).
[Coredump]
Storage=none
