# systemd-oomd acts on memory *pressure* (PSI), not on free memory:
# with zram as the only swap a runaway process never runs out, it
# slides into a minutes-long stall as every page fault becomes a zstd
# round trip. Once a managed slice has stalled more than the limit
# over the window, oomd kills the descendant cgroup with the most
# reclaim activity (oomd.conf(5)) — one app, since niri puts each in
# its own app-niri-*.scope — and the desktop stays responsive. user.slice opts in
# (system/user.slice.d/10-oomd.conf); system.slice (compositor, bar,
# audio, greeter) is never managed.
[OOM]
DefaultMemoryPressureLimit=50%
DefaultMemoryPressureDurationSec=20s
