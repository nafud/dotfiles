# Mullvad first, in both tunnel states. Connected, the app (which tries
# systemd-resolved before any other DNS backend) puts the in-tunnel
# resolver on wg0-mullvad with a "." route-only domain; disconnected,
# the global server below — Mullvad's public resolver over TLS, the
# same ad/tracker/malware-blocking set (base.dns.mullvad.net) as the
# tunnel's — takes every query. "~." on the global servers means a link
# that merely has a default route (Wi-Fi with its DHCP resolver) is
# never asked (systemd-resolved.service(8), "Protocols and routing");
# a link that also carries "~." is queried in parallel — the tunnel
# link when up, the Wi-Fi link only while netmenu's captive-portal
# action holds. FallbackDNS is emptied so nothing drops silently to the
# compiled-in public resolvers.
[Resolve]
DNS=194.242.2.4#base.dns.mullvad.net 2a07:e340::4#base.dns.mullvad.net
FallbackDNS=
Domains=~.
DNSOverTLS=yes
MulticastDNS=no
LLMNR=no
