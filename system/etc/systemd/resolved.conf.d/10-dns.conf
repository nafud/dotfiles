# DNS follows the tunnel, and the tunnel enforces it: connected, the
# Mullvad daemon puts the in-tunnel resolver on wg0-mullvad with a "."
# route-only domain and its firewall rejects DNS to any other
# destination (EPERM on the socket), so nothing leaks; disconnected,
# the connected link's DHCP resolver answers, which is what a VPN that
# is off means. A global pin of Mullvad's public DNS-over-TLS resolver
# for both states was tried and dropped: an ISP that blackholes port
# 853 and external port 53 (the TLS handshake never completes) turns
# "VPN off" into "no name resolution", with nothing left to fall back
# to. What stays is the quiet part: FallbackDNS is emptied so nothing
# drops silently to the compiled-in public resolvers when a link
# brings no DNS, and LLMNR and multicast DNS are off everywhere
# (NetworkManager's connection defaults say the same per link).
[Resolve]
FallbackDNS=
MulticastDNS=no
LLMNR=no
