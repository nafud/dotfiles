# Kernel and network sysctls from the Arch Wiki's Security and Sysctl
# pages that the shipped defaults (systemd's 50-default.conf, Arch's
# 10-arch.conf) leave open on this kernel. Everything here is
# reversible at runtime with sysctl -w; kexec_load_disabled is the one
# one-way switch until reboot.
#
# ICMP redirects: for IPv4 the kernel accepts a redirect when either
# conf/all or the interface allows it (ip-sysctl), so all, default and
# every interface are set; on this machine all.accept_redirects reads 0
# only as a side effect of libvirt's ip_forward=1 and would flip back
# to 1 the day forwarding is turned off. For IPv6 the kernel reads the
# interface value alone, so all is excluded as the wiki shows. The
# default keys cover interfaces that appear later; systemd's udev rule
# re-applies the per-interface keys to a new device.
#
# vm.mmap_rnd_bits=32 is the x86_64 maximum (the default is 28); it is
# the setting known to break sanitizer-instrumented binaries (ASan,
# TSan) and Go's race detector, which map fixed shadow regions. Lower
# it to 28 for such a build. bpf_jit_harden=1 only touches programs
# loaded without CAP_BPF, and unprivileged eBPF is already off
# (unprivileged_bpf_disabled=2), so what remains are seccomp and socket
# filters: small gain, small cost.
#
# Deliberately absent, each for a measured reason:
# kernel.unprivileged_userns_clone stays 1 (Firefox, Chrome, flatpak
# and bubblewrap sandboxes need it); kernel.sysrq stays at systemd's 16
# (sync only; the wiki sees no laptop risk in the rest);
# kernel.yama.ptrace_scope stays 1 (2 would put sudo in front of every
# debugger attach in the boot and login harnesses);
# net.ipv4.tcp_timestamps stays 1 (the wiki warns against turning it
# off); log_martians stays 0 (the wiki: testing only); rp_filter stays
# at systemd's loose 2 until a live test with the VPN, the tailnet and
# a VM up shows strict mode passes.
kernel.kptr_restrict = 1
kernel.kexec_load_disabled = 1
dev.tty.ldisc_autoload = 0
fs.protected_fifos = 2
fs.protected_regular = 2
net.core.bpf_jit_harden = 1
vm.mmap_rnd_bits = 32
vm.mmap_rnd_compat_bits = 16
net.ipv4.tcp_rfc1337 = 1
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.*.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0
net.ipv4.conf.*.secure_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv4.conf.*.send_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv6.conf.*.accept_redirects = 0
-net.ipv6.conf.all.accept_redirects
