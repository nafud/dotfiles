# Lenovo IdeaPad/ThinkBook "conservation mode": the firmware stops
# charging at a fixed ~60 % and holds there while plugged in — the
# storage sweet spot for a laptop that lives on the charger; a cell
# held at 100 % under charger heat ages fastest. The value 1 means
# "the fixed threshold on" whichever way the kernel exposes it: the
# older global conservation_mode knob, or the per-battery charge_types
# (Long_Life) of current kernels, which TLP applies to the battery the
# key names — and the firmware calls the one battery BAT0 on some
# models and BAT1 on others, so both pairs are set (tlp-stat -b shows
# which is present; the other pair is ignored). START is the dummy the
# interface requires (linrunner.de/tlp/settings/bc-vendors). Before a
# trip, `sudo tlp fullcharge` lifts the cap until the next boot (the
# fullcharge alias in config/bash/bashrc). Everything else is TLP's
# default: performance/low-power platform profile and EPP by AC/battery.
START_CHARGE_THRESH_BAT0=0
STOP_CHARGE_THRESH_BAT0=1
START_CHARGE_THRESH_BAT1=0
STOP_CHARGE_THRESH_BAT1=1
