#!/usr/bin/nft -f
# The host firewall: nothing comes in that this machine did not ask
# for. Replaces the package's example ruleset, which opened ssh to the
# world. Only this table is rebuilt on a reload — the Mullvad daemon
# keeps its own `inet mullvad` table for the tunnel's leak protection,
# libvirt its `libvirt_network` table — and flushing the whole ruleset
# would silently take them down under the running daemons. A packet
# must be accepted by every table's chain on its hook, so what the
# other tables allow still has to pass here (the virbr0 rules below).
#
# ssh: sshd is key-only (ssh/sshd_config.d) and reachable through the
# tailnet alone — a packet arriving on tailscale0 was decrypted by
# tailscaled, which already authenticated the peer's WireGuard key
# against the tailnet. The LAN, a café network and the tunnel exit
# see nothing on 22. tailscaled is installed but not enabled (remote
# access is set aside for now, setup.sh), so the rule matches nothing
# until it is; it names the interface, not an address range, which
# is also what keeps a spoofed tailnet source on another link out.
#
# When tailscaled comes back it must run with netfilter mode off. Its
# default mode adds an iptables-nft `ip filter` table whose ts-input
# chain drops every packet from 100.64.0.0/10 that did not arrive on
# tailscale0, and Mullvad's in-tunnel resolvers are 100.64.0.1–63
# answering on wg0-mullvad: with both daemons up every DNS reply was
# dropped (2026-09-01). Its WireGuard listener (41641/udp, see
# /etc/default/tailscaled) then needs an accept here, and the
# `inet tailnet` marks table that let the tailnet bypass the Mullvad
# tunnel returns with it (commit 7389cef has both).
#
# virbr0: the libvirt default network. Its dnsmasq on the bridge
# serves the VMs DHCP and DNS (input), and the VMs reach the world by
# NAT (forward, both directions); libvirt's table only adds the NAT
# and its own forward rules, never an input rule.
destroy table inet filter
table inet filter {
  chain input {
    type filter hook input priority filter; policy drop;

    ct state invalid drop
    ct state { established, related } accept
    iif lo accept
    meta l4proto icmp accept
    meta l4proto ipv6-icmp accept
    # DHCPv6 replies come unicast to the client port from the router's
    # link-local address and are not always tracked as related
    ip6 saddr fe80::/10 udp dport 546 accept
    iifname "tailscale0" tcp dport 22 accept
    iifname "virbr0" meta l4proto { tcp, udp } th dport { 53, 67 } accept
    pkttype host limit rate 5/second counter reject with icmpx type admin-prohibited
    counter
  }
  chain forward {
    type filter hook forward priority filter; policy drop;

    ct state { established, related } accept
    iifname "virbr0" accept
    oifname "virbr0" accept
  }
}

# The `inet tailnet` marks table of 7389cef is gone with tailscaled;
# a reload only rebuilds what this file names, so it is destroyed
# here in case a host still carries it (a no-op once it is gone).
destroy table inet tailnet
