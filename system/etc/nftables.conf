#!/usr/bin/nft -f
# The host firewall: nothing comes in that this machine did not ask
# for. Replaces the package's example ruleset, which opened ssh to the
# world. Only this table is rebuilt on a reload — the Mullvad daemon
# keeps its own `inet mullvad` table for the tunnel's leak protection,
# libvirt its `libvirt_network` table — and flushing the whole ruleset
# would silently take them down under the running daemons. A packet
# must be accepted by every table's chain on its hook, so what the
# other tables allow still has to pass here (the virbr0 rules below).
#
# No service is admitted from the network: there is no remote access
# to this machine, and sshd is not enabled.
#
# virbr0: the libvirt default network. Its dnsmasq on the bridge
# serves the VMs DHCP and DNS (input), and the VMs reach the world by
# NAT (forward, both directions); libvirt's table only adds the NAT
# and its own forward rules, never an input rule.
destroy table inet filter
table inet filter {
  chain input {
    type filter hook input priority filter; policy drop;

    ct state invalid drop
    ct state { established, related } accept
    iif lo accept
    meta l4proto icmp accept
    meta l4proto ipv6-icmp accept
    # DHCPv6 replies come unicast to the client port from the router's
    # link-local address and are not always tracked as related
    ip6 saddr fe80::/10 udp dport 546 accept
    iifname "virbr0" meta l4proto { tcp, udp } th dport { 53, 67 } accept
    pkttype host limit rate 5/second counter reject with icmpx type admin-prohibited
    counter
  }
  chain forward {
    type filter hook forward priority filter; policy drop;

    ct state { established, related } accept
    iifname "virbr0" accept
    oifname "virbr0" accept
  }
}
