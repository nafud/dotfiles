#!/usr/bin/nft -f
# The host firewall: nothing comes in that this machine did not ask
# for. Replaces the package's example ruleset, which opened ssh to the
# world. Only these two tables are rebuilt on a reload — the Mullvad
# daemon keeps its own `inet mullvad` table for the tunnel's leak
# protection, tailscaled its `ts-*` tables, libvirt its
# `libvirt_network` table — and flushing the whole ruleset would
# silently take them down under the running daemons. A packet must be
# accepted by every table's chain on its hook, so what the other
# tables allow still has to pass here (the virbr0 rules below).
#
# ssh: sshd is key-only (ssh/sshd_config.d) and reachable through the
# tailnet alone — a packet arriving on tailscale0 was decrypted by
# tailscaled, which already authenticated the peer's WireGuard key
# against the tailnet. The LAN, a café network and the tunnel exit
# see nothing on 22. 41641/udp is tailscaled's own WireGuard listener
# (/etc/default/tailscaled), opened so peers can reach it directly
# instead of through a relay; WireGuard answers nothing that is not
# signed by a known peer key.
#
# virbr0: the libvirt default network. Its dnsmasq on the bridge
# serves the VMs DHCP and DNS (input), and the VMs reach the world by
# NAT (forward, both directions); libvirt's table only adds the NAT
# and its own forward rules, never an input rule.
destroy table inet filter
table inet filter {
  chain input {
    type filter hook input priority filter; policy drop;

    ct state invalid drop
    ct state { established, related } accept
    iif lo accept
    meta l4proto icmp accept
    meta l4proto ipv6-icmp accept
    # DHCPv6 replies come unicast to the client port from the router's
    # link-local address and are not always tracked as related
    ip6 saddr fe80::/10 udp dport 546 accept
    iifname "tailscale0" tcp dport 22 accept
    udp dport 41641 accept
    iifname "virbr0" meta l4proto { tcp, udp } th dport { 53, 67 } accept
    pkttype host limit rate 5/second counter reject with icmpx type admin-prohibited
    counter
  }
  chain forward {
    type filter hook forward priority filter; policy drop;

    ct state { established, related } accept
    iifname "virbr0" accept
    oifname "virbr0" accept
  }
}

# The tailnet alongside Mullvad. With the tunnel up, Mullvad's policy
# routing (ip rule 5209) sends every unmarked packet into wg0-mullvad
# and its `inet mullvad` chains drop what is neither tunnel nor
# marked, so tailnet traffic would never reach tailscale0. Mullvad's
# split tunnelling is built on two marks that its rules honour, and
# its own guide (help/split-tunneling-with-linux-advanced) is to set
# them from a table of one's own: the connection mark 0xf41 lets the
# connection through Mullvad's filter chains, the packet mark
# 0x6d6f6c65 skips its routing rule so the packet is routed by the
# main tables, where tailscaled's rule (5270, table 52) owns the
# tailnet prefixes. The output chain must sit between priority -200
# and 0, the input chain before Mullvad's input chain at 0.
#
# Marked traffic bypasses the Mullvad tunnel by design; this is only
# ever traffic to tailnet addresses, which are unroutable on the
# Internet and reach their peers inside Tailscale's own WireGuard.
# tailscaled's own packets carry its fwmark 0x80000 for its rules
# 5210 to 5250, not these two, and travel through the Mullvad tunnel
# like everything else.
#
# Tailscale hands out node addresses from all of 100.64.0.0/10 and
# fd7a:115c:a1e0::/48 (tailscale.com/kb/1015, net/tsaddr). Mullvad's
# in-tunnel DNS content blocker resolvers are 100.64.0.1 to
# 100.64.0.63 (mullvad-daemon/src/dns.rs), inside that range, so the
# IPv4 rule starts at 100.64.0.64: a tailnet node the coordination
# server happened to place in 100.64.0.0/26 would be unreachable
# while Mullvad is connected. tailscaled sets neither mark, and the
# marks do nothing while Mullvad is disconnected.
destroy table inet tailnet
table inet tailnet {
  chain output {
    type route hook output priority -100; policy accept;

    ip daddr 100.64.0.64-100.127.255.255 ct mark set 0xf41 meta mark set 0x6d6f6c65
    ip6 daddr fd7a:115c:a1e0::/48 ct mark set 0xf41 meta mark set 0x6d6f6c65
  }
  chain input {
    type filter hook input priority -100; policy accept;

    iifname "tailscale0" ct mark set 0xf41 meta mark set 0x6d6f6c65
  }
}
