# mpv — behavior and chrome only; the picture renders as authored
# (no color or scaling opinions forced on content).

# hardware decoding where safe: smoother playback, less battery
hwdec=auto-safe

# reopen a file where it was left; keep the last frame up at the end
# instead of vanishing mid-thought
save-position-on-quit
keep-open=yes

# OSD in the house font (chrome, not content; subtitles keep their
# own defaults)
osd-font="JetBrainsMono Nerd Font"

# the s key screenshots to the same place niri's Print key does
screenshot-format=png
screenshot-directory=~/Pictures/Screenshots
