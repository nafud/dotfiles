# Portal backends under niri (xdg-desktop-portal reads this for
# XDG_CURRENT_DESKTOP=niri): gnome first — the backend niri documents,
# for screencast and screenshot — with gtk behind it, and gtk named
# outright for the access, notification and file-chooser dialogs.
# No Secret backend is named: the desktop carries no keyring (gcr-4
# supplies the ssh agent only), so that interface is simply not offered.
[preferred]
default=gnome;gtk;
org.freedesktop.impl.portal.Access=gtk;
org.freedesktop.impl.portal.Notification=gtk;
org.freedesktop.impl.portal.FileChooser=gtk;
