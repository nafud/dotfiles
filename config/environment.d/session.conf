# Desktop-session environment, read by the systemd user manager at login
# (environment.d(5)); niri.service and everything niri spawns inherit
# it. Only what the toolkits need under a Wayland compositor — the
# shell's own variables (PATH, EDITOR) are config/bash/profile: the
# login shell's environment, which niri-session imports whole into the
# same manager, and an imported variable outranks one set here.

# native Wayland for Firefox; Java AWT under a tiling compositor; Qt apps
# that skip the xdg-decoration negotiation would otherwise draw their
# own titlebar buttons (niri's prefer-no-csd covers those that negotiate)
MOZ_ENABLE_WAYLAND=1
_JAVA_AWT_WM_NONREPARENTING=1
QT_WAYLAND_DISABLE_WINDOWDECORATION=1
