[mgr]
ratio = [ 1, 3, 4 ]
linemode = "size"
show_symlink = false
sort_by = "natural"
sort_dir_first = true
sort_sensitive = false

# Text and code open in the editor, in this terminal: `edit` is yazi's
# own opener, $EDITOR (Neovim, config/bash/profile), run blocking so
# yazi waits and redraws when it quits. yazi's defaults already route
# text/*, inode/empty and json there; the rest of the code types the
# desktop hands to Neovim (setup.sh's MIME defaults) are added so the
# two agree. prepend_rules: the defaults still handle everything else.
[open]
prepend_rules = [
	{ mime = "text/*",                  use = [ "edit", "reveal" ] },
	# an empty file, a freshly created one most of all: yazi spells it
	# inode/empty; file(1) and xdg say inode/x-empty, so both are listed
	{ mime = "inode/empty",             use = [ "edit", "reveal" ] },
	{ mime = "inode/x-empty",           use = [ "edit", "reveal" ] },
	{ mime = "application/json",        use = [ "edit", "reveal" ] },
	{ mime = "application/toml",        use = [ "edit", "reveal" ] },
	{ mime = "application/yaml",        use = [ "edit", "reveal" ] },
	{ mime = "application/x-yaml",      use = [ "edit", "reveal" ] },
	{ mime = "application/xml",         use = [ "edit", "reveal" ] },
	{ mime = "application/x-shellscript", use = [ "edit", "reveal" ] },
	{ mime = "application/javascript",  use = [ "edit", "reveal" ] },
]
