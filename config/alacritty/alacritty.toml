# mono.toml carries the palette.
[general]
import = [
    "~/.config/alacritty/mono.toml",
]

# Padding 10 is the Sin-cy dotfiles breathing room (their ghostty and
# alacritty configs agree on it). 0.9 is the one transparency level
# used across all glass surfaces (the bar, rofi and mako carry the
# same 90% as hex E6); niri blurs the wallpaper behind each
# (background-effect in config/niri/decorations.kdl), so text stays
# readable.
[window]
padding = { x = 10, y = 10 }
dynamic_padding = true
opacity = 0.9
# niri asks clients not to draw decorations (prefer-no-csd); stating it
# here keeps alacritty deterministic about it
decorations = "None"

[font]
size = 11
normal.family = "JetBrainsMono Nerd Font"

# blinking block, the Linux console convention (the jump palette's
# resting cursor follows the same one)
[cursor.style]
shape = "Block"
blinking = "On"

# a mouse selection is a copy, no Ctrl+Shift+C step — the same contract
# zellij's copy_on_select + wl-copy gives inside the multiplexer
[selection]
save_to_clipboard = true

# new terminal inheriting this one's working directory
[[keyboard.bindings]]
key = "Enter"
mods = "Control|Shift"
action = "SpawnNewInstance"

[[hints.enabled]]
regex = "(https:|http:|file:|git:|ssh:|ftp:|mailto:)[^\\u0000-\\u001F\\u007F-\\u009F<>\"\\s{-}\\^⟨⟩`]+"
hyperlinks = true
command = "xdg-open"
post_processing = true
binding = { key = "T", mods = "Control|Shift" }

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"
