# Lock screen — the session's glass. The palette mirrors the bar
# (config/waybar/style.css): the 0d0d0d ground, c0c0c0 at rest, e8e8e8
# lit, 333333 borders; amber b0a06a for caps lock (the bar's warning
# amber), 98b898 while the answer is checked (the charging green),
# b5626a when it is wrong (the muted rose). hyprlock blurs and sinks
# the wallpaper toward the ground on the GPU — no pre-rendered copy;
# with no wallpaper the color underneath is the flat ground.

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = ~/Pictures/wallpaper.jpg
    color = rgb(0d0d0d)
    blur_passes = 3
    blur_size = 4
    brightness = 0.45
    contrast = 0.9
    vibrancy = 0
    vibrancy_darkness = 0
}

# the hour, resting where the eyes land; the date beneath in the
# resting gray
label {
    monitor =
    text = $TIME
    font_family = JetBrainsMono Nerd Font
    font_size = 72
    color = rgb(e8e8e8)
    position = 0, 150
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%a %d %b"
    font_family = JetBrainsMono Nerd Font
    font_size = 17
    color = rgb(c0c0c0)
    position = 0, 62
    halign = center
    valign = center
}

# the ring: a circle, not a prompt — a square field fully rounded.
# The window-border gray at rest, dots inside as the password lands;
# amber under caps lock, green while the answer is checked, rose when
# it is wrong
input-field {
    monitor =
    size = 110, 110
    outline_thickness = 3
    rounding = -1
    dots_size = 0.2
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgb(333333)
    inner_color = rgb(0d0d0d)
    font_color = rgb(c0c0c0)
    font_family = JetBrainsMono Nerd Font
    placeholder_text =
    check_color = rgb(98b898)
    fail_color = rgb(b5626a)
    capslock_color = rgb(b0a06a)
    fail_text = $ATTEMPTS
    position = 0, -40
    halign = center
    valign = center
}

# the two-letter layout mark, the bar's recipe (en, az, ru)
label {
    monitor =
    text = $LAYOUT[en,az,ru]
    font_family = JetBrainsMono Nerd Font
    font_size = 15
    color = rgb(666666)
    position = 0, -140
    halign = center
    valign = center
}
