# Lock screen — the session's glass. The palette mirrors the bar
# (config/waybar/style.css): the 0d0d0d ground, c0c0c0 at rest, e8e8e8
# lit, 333333 borders. hyprlock blurs and sinks the wallpaper toward
# the ground on the GPU — no pre-rendered copy; with no wallpaper the
# color underneath is the flat ground.

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = ~/Pictures/wallpaper.jpg
    color = rgb(0d0d0d)
    blur_passes = 3
    blur_size = 4
    brightness = 0.45
    contrast = 0.9
    vibrancy = 0
    vibrancy_darkness = 0
}

# the circle holds the whole scene: hour and date inside, input hidden,
# a glass disc on the ring. One neutral color at rest and while typing;
# color only speaks a verdict — green while the answer is checked, red
# when it is wrong, amber while caps lock would betray the password.
# Drawn first so the labels layer inside it.
input-field {
    monitor =
    size = 300, 300
    outline_thickness = 3
    rounding = -1
    hide_input = true
    outer_color = rgb(333333)
    inner_color = rgba(0d0d0de6)
    font_color = rgb(c0c0c0)
    font_family = JetBrainsMono Nerd Font
    placeholder_text =
    fail_text =
    check_color = rgb(98b898)
    fail_color = rgb(ff5555)
    capslock_color = rgb(b0a06a)
    position = 0, 0
    halign = center
    valign = center
}

# The hour above the date, resting inside the ring. Offsets are
# solved, not eyeballed: hyprlock centers each label's pango logical
# box at screen center + offset (IWidget::posFromHVAlign; hyprgraphics
# sizes the texture by logical extents), and pango measures 00:00 at
# 60pt as a 106px box with 61px of digit ink, the date line as 29px.
# The ink stack — digits, 16px gap, date — spans ±53px around the
# circle's center with these offsets.
label {
    monitor =
    text = $TIME
    font_family = JetBrainsMono Nerd Font
    font_size = 60
    color = rgb(e8e8e8)
    position = 0, 22
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%a %d %b"
    font_family = JetBrainsMono Nerd Font
    font_size = 16
    color = rgb(c0c0c0)
    position = 0, -38
    halign = center
    valign = center
}

# the two-letter layout mark under the circle, the bar's recipe
label {
    monitor =
    text = $LAYOUT[en,az,ru]
    font_family = JetBrainsMono Nerd Font
    font_size = 15
    color = rgb(666666)
    position = 0, -178
    halign = center
    valign = center
}
