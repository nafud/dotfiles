# Lock screen — the session's glass. The palette mirrors the bar
# (config/waybar/style.css): the 0d0d0d ground, c0c0c0 at rest, e8e8e8
# lit, 333333 borders. hyprlock blurs and sinks the wallpaper toward
# the ground on the GPU — no pre-rendered copy; with no wallpaper the
# color underneath is the flat ground.

general {
    hide_cursor = true
    ignore_empty_input = true
    # draw widgets over the flat ground at once; the blurred wallpaper
    # joins when ready — the lock appears the moment it is asked for
    immediate_render = true
}

animations {
    # a fade kept, but brief: the appearance should not be a wait
    animation = fadeIn, 1, 2, default
}

background {
    monitor =
    path = ~/Pictures/wallpaper.jpg
    color = rgb(0d0d0d)
    blur_passes = 3
    blur_size = 4
    brightness = 0.45
    contrast = 0.9
    vibrancy = 0
    vibrancy_darkness = 0
}

# the circle holds the whole scene: hour and date inside, input hidden,
# a glass disc on the ring. One neutral color at rest and while typing;
# color only speaks a verdict — green while the answer is checked, red
# when it is wrong, amber while caps lock would betray the password.
# Drawn first so the labels layer inside it.
input-field {
    monitor =
    size = 300, 300
    outline_thickness = 3
    rounding = -1
    hide_input = true
    # each keystroke tints one quadrant of the ring with this color's
    # hue randomly rotated — rotation preserves saturation, and a gray
    # has none, so every flash lands on this same quiet e8e8e8
    hide_input_base_color = rgb(e8e8e8)
    outer_color = rgb(333333)
    inner_color = rgba(0d0d0de6)
    font_color = rgb(c0c0c0)
    font_family = JetBrainsMono Nerd Font
    placeholder_text =
    fail_text =
    check_color = rgb(98b898)
    fail_color = rgb(ff5555)
    capslock_color = rgb(b0a06a)
    position = 0, 0
    halign = center
    valign = center
}

# The hour dead-centered in the circle, alone. The offset is solved,
# not eyeballed: hyprlock centers the label's pango logical box at
# screen center + offset (IWidget::posFromHVAlign), and pango centers
# the digit ink of 00:00 at 60pt in its box within half a pixel — so
# offset 0 puts the digits' ink on the circle's center.
label {
    monitor =
    text = $TIME
    font_family = JetBrainsMono Nerd Font
    font_size = 60
    color = rgb(e8e8e8)
    position = 0, 0
    halign = center
    valign = center
}

# the two-letter layout mark under the circle, the bar's recipe
label {
    monitor =
    text = $LAYOUT[en,az,ru]
    font_family = JetBrainsMono Nerd Font
    font_size = 15
    color = rgb(666666)
    position = 0, -178
    halign = center
    valign = center
}
