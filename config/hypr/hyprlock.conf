# Lock screen — the session's glass. The palette mirrors the bar
# (config/waybar/style.css): the 0d0d0d ground, c0c0c0 at rest, e8e8e8
# lit, 333333 borders. hyprlock blurs and sinks the wallpaper toward
# the ground on the GPU — no pre-rendered copy; with no wallpaper the
# color underneath is the flat ground.

general {
    hide_cursor = true
    ignore_empty_input = true
    # draw widgets over the flat ground at once; the blurred wallpaper
    # joins when ready — the lock appears the moment it is asked for
    immediate_render = true
}

animations {
    # the lock appears instantly — no entrance fade; the unlock
    # fade-out stays
    animation = fadeIn, 0
    # the input field's coming and going (fade_on_empty below): 800ms
    # on hyprutils' default curve, cubic-bezier(0, 0.75, 0.15, 1) —
    # hyprlock's own default, written out because the login page
    # copies these numbers
    animation = inputFieldFade, 1, 8, default
}

background {
    monitor =
    path = ~/Pictures/wallpaper.jpg
    color = rgb(0d0d0d)
    blur_passes = 3
    blur_size = 4
    brightness = 0.45
    contrast = 0.9
    vibrancy = 0
    vibrancy_darkness = 0
}

# the circle holds the whole scene: the hour inside, input hidden, a
# glass disc on the ring. This screen is the reference the login page
# and the boot splash are drawn after. The ring says one thing only:
# lit e8e8e8 while the password is checked. A wrong password and caps
# lock are not painted — fail and caps are pinned to the ring's own rest
# grey because leaving them unset falls back to hyprlock's red (caps
# inherits fail), not to silence; a wrong try answers only with PAM's
# pause, as the boot splash does. (The login page adds the one thing
# it can say and hyprlock cannot: "wrong password" as a line under the
# name, and a "λ" blinking in the hour's place while checking.)
# The field — ring, disc and the keystroke's quadrant; the hour is a
# label of its own and stays — is not there until the first keystroke,
# stays while something is typed or checked, and goes fade_timeout
# after the field empties again (a wrong password empties it): the
# idle lock is the hour over the glass. hyprlock's own fade_on_empty,
# spelled out with its timeout because the login page copies the rule.
# hyprlock draws the outline outside `size`, so the disc is 294 and the
# ring 300 with its 3px edge, as on the other two screens — and it
# measures in the output's own pixels whatever the compositor's scale
# (font_size in points at 96 dpi: 60 is an 80px hour), which the login
# page and the splash follow, so the three rings are one size on the
# same panel. Drawn first
# so the labels layer inside it. The hidden input's way with keystrokes
# — one quadrant lit at random, never the same twice running, held
# until the next — is what the login page copies.
input-field {
    monitor =
    size = 294, 294
    outline_thickness = 3
    rounding = -1
    hide_input = true
    # each keystroke tints one quadrant of the ring with this color's
    # hue randomly rotated — rotation preserves saturation, and a gray
    # has none, so every flash lands on this same quiet e8e8e8
    hide_input_base_color = rgb(e8e8e8)
    fade_on_empty = true
    fade_timeout = 2000
    outer_color = rgb(333333)
    inner_color = rgba(0d0d0d66)
    font_color = rgb(c0c0c0)
    font_family = JetBrainsMono Nerd Font
    placeholder_text =
    fail_text =
    check_color = rgb(e8e8e8)
    fail_color = rgb(333333)
    capslock_color = rgb(333333)
    position = 0, 0
    halign = center
    valign = center
}

# The hour dead-centered in the circle, alone. The offset is solved,
# not eyeballed: hyprlock centers the label's pango logical box at
# screen center + offset (IWidget::posFromHVAlign), and pango centers
# the digit ink of 00:00 at 60pt in its box within half a pixel — so
# offset 0 puts the digits' ink on the circle's center.
label {
    monitor =
    text = $TIME
    font_family = JetBrainsMono Nerd Font
    font_size = 60
    color = rgb(e8e8e8)
    position = 0, 0
    halign = center
    valign = center
}

# The keyboard layout under the circle — which one the password will
# be typed in — as the bar's two-letter mark, re-rendered on every
# switch (Alt+Shift, which works on the lock as an xkb option). The
# marks are positional over the layout list in config/niri/input.kdl
# ("us,ru,az"), so the two lists move together: hyprlock cannot derive
# a mark from the xkb name, and a list that falls short prints the raw
# $LAYOUT[...] text on the lock.
# Centered 185px below screen center, as the login page's line: the
# ring ends at 150, the text's box begins ~21px under it.
label {
    monitor =
    text = $LAYOUT[en,ru,az]
    font_family = JetBrainsMono Nerd Font
    font_size = 16
    color = rgb(c0c0c0)
    position = 0, -185
    halign = center
    valign = center
}
