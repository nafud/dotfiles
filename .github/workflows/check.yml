# CI for the dotfiles: tools/check, the same pre-flight run before every
# push in development — shell scripts lint and parse, python compiles,
# structured configs parse, the layout lists agree. Catches a stray
# comma or quote before it reaches the next `setup.sh link`.
name: check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: tools/check
        run: tools/check

  # The niri config is the one file that can lock you out of a session,
  # so it gets a real parse by the real binary on the platform these
  # dotfiles target.
  niri-validate:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4

      - name: install niri
        run: pacman -Syu --noconfirm niri

      - name: niri config validates
        run: niri validate --config config/niri/config.kdl
