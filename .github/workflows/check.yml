# CI for the dotfiles: tools/check, the same pre-flight run before every
# push in development — shell scripts lint and parse, python compiles,
# structured configs parse, the layout lists agree. Catches a stray
# comma or quote before it reaches the next `setup.sh link`.
name: check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: tools/check
        run: tools/check

  # Two checks need the platform these dotfiles target: the niri config
  # is the one file that can lock you out of a session, so it gets a
  # real parse by the real binary; and check-system sources setup.sh,
  # exercised here on the Arch it targets.
  arch:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4

      - name: install niri and the suite's tools
        run: pacman -Syu --noconfirm niri diffutils

      - name: niri config validates
        run: niri validate --config config/niri/config.kdl

      # the container is root and setup.sh refuses to be sourced as
      # root, the same guard that protects a desk run; the suite needs
      # nothing more than a user that can read the checkout
      - name: tests/check-system
        run: |
          useradd -m check
          runuser -u check -- tests/check-system
